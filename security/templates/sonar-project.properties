# SonarQube: copy to the repo root once you have a SonarQube server, and set
# the workflow input `sonar-host-url` plus the SONAR_TOKEN secret.
#
# Until then, nothing reads this file. Every run publishes the same reports as
# the "<prefix>.sonar-reports" artifact: coverage, lint output and every
# scanner's SARIF, so you can load a run into Sonar by hand, or just read them.
#
# The workflow's sonar job fills in the report paths itself (coverage, golangci-lint,
# ruff, ESLint, SARIF), so they don't belong here.

sonar.projectKey=ORG_REPO
sonar.projectName=REPO
sonar.sources=.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/*.pb.go,**/testdata/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/test_*.py,**/*.test.ts
