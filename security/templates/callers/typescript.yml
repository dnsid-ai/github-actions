# Copy to .github/workflows/ci.yml in the repo that uses it. Replace <SHA> with the
# commit of the github-actions release you are adopting (pin the SHA, not a
# tag or branch), and keep the version comment beside it.
#
# Then make "typescript / Summary" a required status check on main. It fails if any job
# fails, or if a scanner silently produced no report.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    uses: <org>/github-actions/.github/workflows/security-typescript.yml@<SHA> # v1.0.0
    permissions:
      contents: read # check out the code
      security-events: write # upload SARIF to code scanning
      actions: read # code scanning reads run metadata on private repos
      pull-requests: write # required: the Summary job posts a sticky PR comment
    with:
      node-version-file: .nvmrc
      # rebuild: esbuild                      # packages whose install scripts must run
      # allowed-install-scripts: esbuild fsevents
      # coverage-file: coverage/lcov.info
      enforce-security: false                 # flip to true once the baseline is triaged
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
