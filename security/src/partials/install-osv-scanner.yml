# osv-scanner 2.6.0, pinned by SHA-256 (verified against the release's published
# checksums when it ships one). Bump VERSION and SHA256 together.
- name: Install osv-scanner
  env:
    VERSION: "2.6.0"
    SHA256: "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108"
  run: |
    set -euo pipefail
    bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
    pkg="$RUNNER_TEMP/osv-scanner.download"
    curl -fsSL --retry 3 -o "$pkg" "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64"
    echo "${SHA256}  $pkg" | sha256sum -c -
    install -m 0755 "$pkg" "$bin/osv-scanner"
    echo "$bin" >> "$GITHUB_PATH"
