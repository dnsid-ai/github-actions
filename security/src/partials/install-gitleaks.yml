# gitleaks 8.30.1, pinned by SHA-256 (verified against the release's published
# checksums when it ships one). Bump VERSION and SHA256 together.
- name: Install gitleaks
  env:
    VERSION: "8.30.1"
    SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  run: |
    set -euo pipefail
    bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
    pkg="$RUNNER_TEMP/gitleaks.download"
    curl -fsSL --retry 3 -o "$pkg" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
    echo "${SHA256}  $pkg" | sha256sum -c -
    tar -xzf "$pkg" -C "$bin" gitleaks
    echo "$bin" >> "$GITHUB_PATH"
