# npm (package-lock.json) or pnpm (pnpm-lock.yaml). Installs from the lockfile,
# with lifecycle scripts off by default: a compromised transitive dependency's
# postinstall is the classic npm supply-chain attack. Packages that genuinely need
# their scripts (esbuild, for example) go in `rebuild` and are rebuilt explicitly.
- name: Set up pnpm
  if: hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) != ''
  uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
  with:
    package_json_file: ${{ inputs.working-directory }}/package.json
- name: Set up Node.js
  uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
  with:
    node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
    node-version-file: ${{ inputs.node-version-file != '' && format('{0}/{1}', inputs.working-directory, inputs.node-version-file) || '' }}
    package-manager-cache: false
- name: Install dependencies
  id: env
  env:
    WD: ${{ inputs.working-directory }}
    IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
    REBUILD: ${{ inputs.rebuild }}
  run: |
    set -euo pipefail
    cd "$WD"
    flags=()
    if [ "$IGNORE_SCRIPTS" = true ]; then flags+=(--ignore-scripts); fi
    if [ -f pnpm-lock.yaml ]; then
      pm=pnpm
      pnpm install --frozen-lockfile "${flags[@]}"
    elif [ -f package-lock.json ]; then
      pm=npm
      npm ci --no-audit --no-fund "${flags[@]}"
    else
      echo "::error::No package-lock.json or pnpm-lock.yaml in $WD. A lockfile is required for reproducible installs."
      exit 1
    fi
    if [ -n "$REBUILD" ]; then
      # shellcheck disable=SC2086 # REBUILD is a list of package names
      "$pm" rebuild $REBUILD
    fi
    echo "pm=$pm" >> "$GITHUB_OUTPUT"
