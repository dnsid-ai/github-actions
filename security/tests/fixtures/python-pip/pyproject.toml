[project]
name = "sample-pip"
version = "0.1.0"
description = "Self-test target for the Python workflow (no lockfile: pip fallback)."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sample"]
