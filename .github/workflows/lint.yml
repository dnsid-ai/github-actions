name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Generated files, actionlint, zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated workflows are up to date
        run: python3 scripts/build.py --check
      - name: Install actionlint
        env:
          VERSION: "1.7.12"
          SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/actionlint.tgz"
          curl -fsSL --retry 3 -o "$pkg" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $pkg" | sha256sum -c -
          tar -xzf "$pkg" -C "$RUNNER_TEMP" actionlint
      - name: actionlint (includes shellcheck of every run block)
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --disable-pip-version-check zizmor==1.30.1
          "$RUNNER_TEMP/zizmor/bin/zizmor" --persona auditor .
