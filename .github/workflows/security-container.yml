# GENERATED from security/src/container.yml by scripts/build.py. Do not edit here:
# edit security/src/ and run `python3 scripts/build.py`.
# Builds a container image locally (nothing is pushed) and scans it before it
# reaches a registry: OS-package and language vulnerabilities, and secrets baked
# into layers. Also writes an SBOM of the image. Scanning before the push
# catches problems before the image reaches any registry.
#
#   jobs:
#     image:
#       uses: <org>/github-actions/.github/workflows/security-container.yml@<sha> # v1
#       permissions: { contents: read, security-events: write, actions: read }
#       with:
#         dockerfile: Dockerfile
#
# Mark "<caller job> / Summary" as the required check. See README.md.
name: Container

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label. Must be Linux x64.
        type: string
        default: ubuntu-24.04
      scan-every-push:
        description: >-
          Force scanning on every commit, bypassing PR change selection.
          By default PRs scan when their Dockerfile, build context or configuration
          changes. Non-PR events and the 'rerun-security' label force a full scan.
        type: boolean
        default: false
      artifact-prefix:
        description: Prefix for artifact names. Set it when one run calls this workflow more than once (e.g. one call per image).
        type: string
        default: container
      enforce-security:
        description: When false (the default), findings are reported but do not fail the build.
        type: boolean
        default: false
      upload-sarif:
        description: Upload SARIF results to GitHub code scanning.
        type: boolean
        default: true
      context:
        description: Docker build context, relative to the repository root.
        type: string
        default: "."
      dockerfile:
        description: Dockerfile path, relative to the repository root.
        type: string
        default: Dockerfile
      target:
        description: Build stage to scan (--target). Empty builds the final stage.
        type: string
        default: ""
      build-args:
        description: Newline-separated KEY=VALUE build arguments. Not for secrets.
        type: string
        default: ""
      trivy-severity:
        description: Comma-separated Trivy severities to report.
        type: string
        default: HIGH,CRITICAL
      ignore-unfixed:
        description: Skip vulnerabilities that have no fixed version yet.
        type: boolean
        default: false
      sbom:
        description: Write an SPDX SBOM of the built image into the reports artifact.
        type: boolean
        default: true

permissions: {}

jobs:
  selection:
    name: Select checks
    env:
      KIND: container
    # Caller supplies the job's KIND environment variable; code below is generated
    # from this trusted workflow release, not executed from the caller's checkout.
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.select.outputs.plan }}
    steps:
      - name: Check out commit graph for PR selection
        if: ${{ github.event_name == 'pull_request' && !inputs.scan-every-push && !contains(github.event.pull_request.labels.*.name, 'rerun-security') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Select checks
        id: select
        env:
          INPUTS: ${{ toJSON(inputs) }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FORCE: ${{ inputs.scan-every-push || contains(github.event.pull_request.labels.*.name, 'rerun-security') }}
        run: |
          python3 -I - <<'PY'
          """Conservative PR selection; embedded into workflows, never loaded from caller code."""
          import json
          import os
          from pathlib import PurePosixPath
          import subprocess


          def changed_paths(base, head, cwd=None):
              try:
                  # --no-renames retains both the deleted and added path of a rename.
                  diff = subprocess.check_output(
                      ["git", "diff", "--name-only", "--no-renames", "-z", f"{base}...{head}", "--"],
                      cwd=cwd, stderr=subprocess.PIPE,
                  )
                  return diff.decode("utf-8").rstrip("\0").split("\0") if diff else []
              except (subprocess.CalledProcessError, UnicodeError, OSError):
                  return None


          def documentation(path):
              p = PurePosixPath(path)
              return (
                  p.suffix.lower() in {".md", ".rst", ".txt"}
                  and (path.startswith("docs/") or (len(p.parts) == 1 and p.stem.upper() in {
                      "README", "CHANGELOG", "CONTRIBUTING", "LICENSE", "AUTHORS", "CODE_OF_CONDUCT", "SECURITY",
                  }))
              )


          def configuration(path):
              p = PurePosixPath(path)
              # Configuration and local actions can change scanner inputs or execution.
              return (path.startswith(".github/") or p.name.startswith(".")
                      or p.name in {"action.yml", "action.yaml", "go.mod", "go.sum", "go.work", "go.work.sum", "Pipfile"}
                      or "requirements" in p.name.lower()
                      or p.suffix in {".toml", ".json", ".yaml", ".yml", ".ini", ".cfg", ".lock"})


          def plan(kind, inputs, paths):
              full = paths is None or not paths or inputs.get("scan-every-push", False)
              config = full or any(configuration(p) for p in paths)
              project = full or config or any(not documentation(p) for p in paths)
              enabled = {
                  "lint": kind == "python" or inputs.get("lint", True),
                  "test": inputs.get("test", True),
                  "deps": True,
                  "gosec": True,
                  "codeql": inputs.get("codeql", True),
                  "codeql-actions": inputs.get("codeql-actions", False),
                  "semgrep": inputs.get("semgrep", True),
                  "secrets": inputs.get("gitleaks", True),
                  "trivy": inputs.get("trivy", True),
                  "workflow-audit": inputs.get("workflow-audit", True),
                  "dependency-review": inputs.get("dependency-review", True),
                  "sbom": inputs.get("sbom", False),
                  "sonar": bool(inputs.get("sonar-host-url", "")),
                  "terraform": inputs.get("tflint", True),
                  "kubernetes": bool(inputs.get("manifests-command", "") or inputs.get("manifests-path", "")),
                  "shell": inputs.get("shellcheck", True),
                  "image": True,
              }
              affected = {job: project for job in enabled}
              for job in ("lint", "test", "terraform", "kubernetes", "shell", "secrets"):
                  affected[job] = True  # Preserve fast feedback and full-history secret coverage.
              affected["workflow-audit"] = affected["codeql-actions"] = config
              if kind == "typescript":
                  # osv-scanner consumes only the lockfile; source changes cannot alter its packages.
                  affected["deps"] = config
              if kind == "iac":
                  affected["codeql"] = config if inputs.get("codeql-languages", "actions") == "actions" else project
              if kind == "container":
                  context = PurePosixPath(inputs.get("context", "."))
                  dockerfile = PurePosixPath(inputs.get("dockerfile", "Dockerfile"))
                  # Remote/out-of-tree contexts cannot be safely classified from a repo diff.
                  unknown_context = ":" in str(context) or context.is_absolute() or ".." in context.parts
                  affected["image"] = full or config or unknown_context or any(
                      PurePosixPath(p) == dockerfile or PurePosixPath(p).is_relative_to(context) for p in paths
                  )
              jobs = {
                  "go": "lint test deps gosec codeql codeql-actions semgrep secrets trivy workflow-audit dependency-review sbom sonar",
                  "python": "lint test deps codeql codeql-actions semgrep secrets trivy workflow-audit dependency-review sbom sonar",
                  "typescript": "lint test deps codeql codeql-actions semgrep secrets trivy workflow-audit dependency-review sbom sonar",
                  "iac": "terraform kubernetes shell codeql semgrep secrets trivy workflow-audit",
                  "container": "image",
              }[kind].split()
              result = {}
              for job in jobs:
                  run = enabled[job] and affected[job]
                  reason = ("disabled by caller" if not enabled[job] else
                            "full scan (forced, non-PR, empty or unavailable diff)" if full else
                            "required for changed inputs or every-push coverage" if run else
                            "not applicable to changed paths")
                  result[job] = {"run": run, "reason": reason}
              return result


          def main():
              inputs = json.loads(os.environ["INPUTS"])
              paths = None
              if os.environ["EVENT"] == "pull_request" and os.environ["FORCE"] != "true":
                  paths = changed_paths(os.environ["BASE"], os.environ["HEAD"])
              selected = plan(os.environ["KIND"], inputs, paths)
              if os.environ["KIND"] == "container":
                  context = inputs.get("context", ".")
                  if os.path.realpath(context) != os.path.abspath(context):
                      selected["image"] = {"run": True, "reason": "symlinked build context has unknown input scope"}
              # Custom rules may deliberately scan documentation; never infer their scope.
              if "semgrep" in selected and inputs.get("semgrep", True):
                  wd = inputs.get("working-directory", ".")
                  rules = inputs.get("semgrep-rules", "")
                  defaults = {
                      "go": "p/golang p/gosec p/secrets",
                      "python": "p/python p/secrets",
                      "typescript": "p/typescript p/javascript p/nodejsscan p/secrets",
                      "iac": "p/terraform p/kubernetes p/dockerfile p/secrets",
                  }
                  if os.path.isdir(os.path.join(wd, ".semgrep")) or rules != defaults[os.environ["KIND"]]:
                      selected["semgrep"] = {"run": True, "reason": "custom Semgrep rules have unknown input scope"}
              # Dependency review only exists on PRs, even during a full scan.
              if "dependency-review" in selected and os.environ["EVENT"] != "pull_request":
                  selected["dependency-review"] = {"run": False, "reason": "not a pull request"}
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("plan=" + json.dumps(selected, separators=(",", ":")) + "\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("### Scan selection\n\n")
                  summary.write("Unavailable or empty diffs run conservatively; secrets retain full-history coverage.\n\n")
                  summary.write("| Check | Run | Reason |\n|---|---|---|\n")
                  for job, decision in selected.items():
                      summary.write(f"| {job} | {decision['run']} | {decision['reason']} |\n")


          if __name__ == "__main__":
              main()
          PY

  image:
    needs: selection
    if: ${{ fromJSON(needs.selection.outputs.plan)['image'].run }}
    name: Image scan (Trivy)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    permissions:
      contents: read # check out the code
      security-events: write # upload SARIF to code scanning
      actions: read # code scanning reads run metadata on private repos
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # trivy 0.74.0, pinned by SHA-256 (verified against the release's published
      # checksums when it ships one). Bump VERSION and SHA256 together.
      - name: Install trivy
        env:
          VERSION: "0.74.0"
          SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          pkg="$RUNNER_TEMP/trivy.download"
          curl -fsSL --retry 3 -o "$pkg" "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  $pkg" | sha256sum -c -
          tar -xzf "$pkg" -C "$bin" trivy
          echo "$bin" >> "$GITHUB_PATH"
      - name: Build image (local only, not pushed)
        id: build
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          TARGET: ${{ inputs.target }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          set -euo pipefail
          image="scan.local/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}"
          args=(build --file "$DOCKERFILE" --tag "$image")
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          while IFS= read -r arg; do
            if [ -n "$arg" ]; then args+=(--build-arg "$arg"); fi
          done <<< "$BUILD_ARGS"
          docker "${args[@]}" "$CONTEXT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Scan
        id: scan
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          SEVERITY: ${{ inputs.trivy-severity }}
          IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/reports"; mkdir -p "$out"
          # shellcheck disable=SC2054 # the commas are Trivy's list syntax
          args=(image --scanners vuln,secret --severity "$SEVERITY" --exit-code 0 --no-progress)
          if [ "$IGNORE_UNFIXED" = true ]; then args+=(--ignore-unfixed); fi
          if [ -f .trivyignore.yaml ]; then args+=(--ignorefile .trivyignore.yaml); fi
          trivy "${args[@]}" --format json --output "$out/trivy-image.json" "$IMAGE"
          trivy convert --format sarif --output "$out/trivy-image.sarif" "$out/trivy-image.json"
          {
            echo "### Image"
            echo
            trivy convert --format table "$out/trivy-image.json" | sed 's/^/    /'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "sarif=$out/trivy-image.sarif"
            echo "tool=Trivy (image)"
          } >> "$GITHUB_OUTPUT"
      # Turns the scan step's SARIF into: a findings count (read by the summary job),
      # a table in the job summary, and, when enforce-security is on, a failing exit.
      # The scan step must have id "scan" and set outputs `sarif`, `tool` and,
      # optionally, `levels` (space-separated SARIF levels to count; empty = all) and
      # `base` (the directory the tool's paths are relative to; they are rewritten to
      # be repo-root-relative so code scanning can place them).
      - name: Report findings
        if: always() && steps.scan.outcome == 'success'
        env:
          ENFORCE: ${{ inputs.enforce-security }}
          SARIF: ${{ steps.scan.outputs.sarif }}
          TOOL: ${{ steps.scan.outputs.tool }}
          LEVELS: ${{ steps.scan.outputs.levels }}
          BASE: ${{ steps.scan.outputs.base }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ]; then
            jq --arg base "${BASE%/}" '
              del(.runs[]?.originalUriBaseIds)
              | (.runs[]?.results[]?.locations[]?.physicalLocation.artifactLocation) |=
                  (del(.uriBaseId) | .uri |= (if $base == "." or test("^(/|[a-z]+:)") then . else $base + "/" + . end))' \
              "$SARIF" > "$SARIF.rebased"
            mv "$SARIF.rebased" "$SARIF"
          fi
          # shellcheck disable=SC2016 # $levels is a jq variable, not a shell one
          filter='[.runs[]?.results[]? | select(($levels == "") or ((.level // "warning") as $l | $levels | split(" ") | index($l)))]'
          count=$(jq --arg levels "$LEVELS" "$filter | length" "$SARIF")
          echo "$count" > "$(dirname "$SARIF")/findings.txt"
          # Render the rows to a file first, then head the file. Piping `jq | head`
          # breaks under `set -o pipefail`: when there are >100 findings, head closes
          # the pipe after 100 lines and jq dies with "writing output failed: Broken
          # pipe", failing the whole job (seen on CodeQL with a large PR).
          rows="$(dirname "$SARIF")/report-rows.md"; : > "$rows"
          if [ "$count" -gt 0 ]; then
            jq -r --arg levels "$LEVELS" "$filter"'[] | [(.level // "warning"), (.ruleId // "-"),
                ((.locations[0].physicalLocation.artifactLocation.uri // "-") + ":" + ((.locations[0].physicalLocation.region.startLine // "") | tostring))]
              | map(tostring | gsub("\\|"; "\\|")) | "| \(.[0]) | `\(.[1])` | `\(.[2])` |"' "$SARIF" > "$rows"
          fi
          {
            echo "### $TOOL: $count finding(s)${LEVELS:+ (levels: $LEVELS)}"
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Level | Rule | Location |"
              echo "|---|---|---|"
              head -n 100 "$rows"
              if [ "$count" -gt 100 ]; then echo "| | $((count - 100)) more in the reports artifact | |"; fi
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            if [ "$ENFORCE" = true ]; then
              echo "::error::$TOOL reported $count finding(s)"
              exit 1
            fi
            echo "::warning::$TOOL reported $count finding(s). Warn-only: set enforce-security: true to block merges."
          fi
      # Private repositories need GitHub Advanced Security to accept SARIF, and a repo
      # with CodeQL "default setup" switched on rejects advanced-setup CodeQL results.
      # Neither should fail the build: the same SARIF is always in the reports artifact.
      - name: Upload SARIF to code scanning
        id: upload-sarif
        if: always() && inputs.upload-sarif && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: ${{ inputs.artifact-prefix }}/${{ github.job }}
      - name: Note a failed SARIF upload
        if: always() && steps.upload-sarif.outcome == 'failure'
        run: |
          echo "::warning::SARIF upload to code scanning failed (no Advanced Security, CodeQL default setup enabled, or missing security-events: write). Results are still in the reports artifact."
          echo "> SARIF upload to code scanning failed; results are in the reports artifact only." >> "$GITHUB_STEP_SUMMARY"
      - name: Generate SPDX SBOM of the image
        if: inputs.sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.build.outputs.image }}
          format: spdx-json
          output-file: ${{ runner.temp }}/reports/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # Reports are staged under a directory named for the job, so every artifact
      # unpacks to <job>/... . Downloaders then use merge-multiple and get the same
      # layout whether one artifact matches or many; without merging, a single match
      # is unpacked flat and the job name is lost.
      - name: Stage reports
        if: always()
        env:
          JOB: ${{ github.job }}
        run: |
          if [ -d "$RUNNER_TEMP/reports" ]; then
            mkdir -p "$RUNNER_TEMP/upload/$JOB"
            cp -R "$RUNNER_TEMP/reports/." "$RUNNER_TEMP/upload/$JOB/"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}.reports.${{ github.job }}
          path: ${{ runner.temp }}/upload/
          if-no-files-found: ignore
          retention-days: 30

  summary:
    name: Summary
    if: always()
    needs: [selection, image]
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
      pull-requests: write # post the sticky PR comment; capped by the caller's grant, so a caller that omits it just gets a 403-warn, not a failure
    env:
      REQUIRED_REPORTS: image
    steps:
      # The one check a caller needs to mark as required. It fails when any job
      # failed, and when a scanner job "succeeded" without writing a report: that
      # would be a gate that is green over nothing. The job needs `env.REQUIRED_REPORTS`,
      # the space-separated ids of jobs that must leave a report whenever they run.
      #
      # Selection-aware workflows allow only skips explicitly approved by the plan.
      # DAST retains its event-based gate (it normally runs on dispatch/schedule).
      - name: Require a scan of the current commit
        if: ${{ fromJSON(toJSON(needs)).selection.result == '' && !inputs.scan-every-push && github.event_name == 'pull_request' && github.event.action == 'synchronize' && !contains(github.event.pull_request.labels.*.name, 'rerun-security') }}
        env:
          PREFIX: ${{ inputs.artifact-prefix }}
        run: |
          msg="Security scans do not re-run on each push, so this commit was not scanned. To scan it before merging, add the 'rerun-security' label to the PR and push again (or reopen the PR)."
          echo "::error::$msg"
          # Write the sticky-comment body too, with the marker so the "Comment on the
          # PR" step updates the same comment. Without this it exits before Summarize
          # writes summary.md, leaving an earlier commit's green "passed" summary in
          # the PR comment while this commit is unscanned.
          md="$RUNNER_TEMP/summary.md"
          {
            echo "<!-- security-summary:$PREFIX -->"
            echo "## $PREFIX: this commit was not scanned"
            echo
            echo "$msg"
          } > "$md"
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Download reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-prefix }}.reports.*
          path: ${{ runner.temp }}/all
          merge-multiple: true # each artifact holds <job>/..., see upload-reports.yml
      - name: Summarize
        env:
          NEEDS: ${{ toJSON(needs) }}
          PREFIX: ${{ inputs.artifact-prefix }}
          ENFORCE: ${{ inputs.enforce-security }}
          PLAN: ${{ fromJSON(toJSON(needs)).selection.outputs.plan || '{}' }}
        run: |
          set -euo pipefail
          all="$RUNNER_TEMP/all"; mkdir -p "$all"
          sonar="$RUNNER_TEMP/sonar-reports"; mkdir -p "$sonar"
          # Build the report once into a file, then publish it to both the run's
          # job summary and (in the "Comment on the PR" step) a sticky PR comment.
          md="$RUNNER_TEMP/summary.md"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fail=0
          if jq -e 'has("selection")' <<<"$NEEDS" > /dev/null; then
            if [ "$(jq -r '.selection.result' <<<"$NEEDS")" != success ] || ! jq -e 'type == "object" and length > 0' <<<"$PLAN" > /dev/null; then
              echo "::error::Check selection did not complete successfully"
              fail=1
            fi
          fi
          {
            echo "<!-- security-summary:$PREFIX -->"
            echo "## $PREFIX: summary"
            echo
            if [ "$ENFORCE" = true ]; then
              echo "Security findings **block** this check (enforce-security: true)."
            else
              echo "Security findings are **warn-only** (enforce-security: false). Lint, test and tool failures still block."
            fi
            echo
            echo "| Job | Result | Findings | Report files |"
            echo "|---|---|---|---|"
          } > "$md"
          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            dir="$all/$job"
            files="-"; findings="-"
            if [ "$job" != selection ] && jq -e 'has("selection")' <<<"$NEEDS" > /dev/null; then
              decision=$(jq -r --arg j "$job" '.[$j].run // false' <<<"$PLAN")
              if ! jq -e --arg j "$job" '.[$j].run | type == "boolean"' <<<"$PLAN" > /dev/null; then
                echo "::error::No selection decision for $job"
                fail=1
              elif [ "$result" = skipped ] && [ "$decision" = true ]; then
                result="skipped, but REQUIRED by selection"
                fail=1
              elif [ "$result" = skipped ]; then
                reason=$(jq -r --arg j "$job" '.[$j].reason' <<<"$PLAN")
                result="skipped ($reason)"
              fi
            fi
            if [ -d "$dir" ] && [ -n "$(find "$dir" -type f -print -quit)" ]; then
              files=$(find "$dir" -type f ! -name findings.txt -printf '%f\n' | sort | paste -sd' ' -)
              if [ -f "$dir/findings.txt" ]; then findings=$(cat "$dir/findings.txt"); fi
              # Flatten into one Sonar-ready bundle, prefixed by job so names can't collide.
              find "$dir" -type f ! -name findings.txt -exec sh -c 'cp "$1" "$2/$3-$(basename "$1")"' _ {} "$sonar" "$job" \;
            elif [ "$result" = success ] && [[ " $REQUIRED_REPORTS " == *" $job "* ]]; then
              result="success, but NO REPORT: did the scanner run?"
              fail=1
            fi
            case "$result" in failure|cancelled) fail=1 ;; esac
            echo "| $job | $result | $findings | $files |" >> "$md"
          done
          {
            echo
            if [ "$fail" -ne 0 ]; then echo "**Result: failed** — see the failing job(s) above."; else echo "**Result: passed.**"; fi
          } >> "$md"
          # Human-readable findings, rendered from the collected SARIF: a how-to-fix
          # table in the comment and job summary, and a self-contained HTML report
          # uploaded as an artifact. The remediation text and docs links come from
          # each tool's own rule metadata (help / helpUri).
          report="$RUNNER_TEMP/report"; mkdir -p "$report"
          tsv="$RUNNER_TEMP/findings.tsv"; : > "$tsv"
          # shellcheck disable=SC2016 # $run/$rules/$r are jq variables, not shell
          jqprog='
            .runs[]? as $run
            | ($run.tool.driver.name // "tool") as $tool
            | ($run.tool.driver.rules // []) as $rules
            | $run.results[]? | . as $r
            | ($r.ruleId // $r.rule.id // "") as $rid
            # Resolve the rule by id. Trust ruleIndex only when the rule it points at
            # actually carries this ruleId: gosec emits wrong indices (a G124 result
            # whose ruleIndex points at the G302 rule), which would otherwise pull a
            # different rule help/helpUri text into this finding row.
            | (($r.ruleIndex // -1) as $ix
               | if $ix >= 0 and (($rules[$ix].id // "") == $rid) then $rules[$ix]
                 else ((first($rules[]? | select(.id==$rid))) // {}) end) as $rule
            | ($r.level // $rule.defaultConfiguration.level // "warning") as $lvl
            | ($r.locations[0].physicalLocation // {}) as $loc
            | (($loc.artifactLocation.uri // "") + (if $loc.region.startLine then ":"+($loc.region.startLine|tostring) else "" end)) as $where
            | ($rule.helpUri // "") as $uri
            | (($r.message.text // "") | gsub("[\t\n]";" ")) as $msg
            | (($rule.help.text // $rule.fullDescription.text // $rule.shortDescription.text // "") | gsub("[\t\n]";" ")) as $help
            | [$lvl,$tool,$rid,$where,$uri,$msg,$help] | @tsv'
          while IFS= read -r sf; do jq -r "$jqprog" "$sf" 2>/dev/null >> "$tsv" || true; done < <(find "$all" -name '*.sarif' 2>/dev/null)
          n=$(wc -l < "$tsv" | tr -d ' '); n=${n:-0}
          ordered="$RUNNER_TEMP/findings.ordered"
          { grep -P '^error\t' "$tsv" || true; grep -P '^warning\t' "$tsv" || true; grep -Pv '^(error|warning)\t' "$tsv" || true; } > "$ordered"
          htmlesc() { sed -e 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }
          tab=$(printf '\t')
          if [ "$n" -gt 0 ]; then
            {
              echo
              echo "Full HTML report with remediation: the **$PREFIX.security-report** artifact on [this run]($run_url)."
              echo
              echo "<details><summary><b>Findings ($n)</b> — where and how to fix</summary>"
              echo
              echo "| Sev | Location | Issue | How to fix |"
              echo "|---|---|---|---|"
            } >> "$md"
            head -100 "$ordered" | while IFS="$tab" read -r lvl tool rid where uri msg help; do
              # Link only when helpUri is a real URL. Some tools (gosec) put prose
              # there, not a link; use it as the fix text when there's no help text.
              fixtext="$help"; link=""
              case "$uri" in
                http://*|https://*) link=" [docs]($uri)" ;;
                "") : ;;
                *) if [ -z "$fixtext" ]; then fixtext="$uri"; fi ;;
              esac
              # shellcheck disable=SC2016 # the backticks are literal markdown, not a command substitution
              printf '| %s | `%s` | %s <sub>%s/%s</sub> | %s%s |\n' "$lvl" "$where" "$msg" "$tool" "$rid" "$fixtext" "$link"
            done >> "$md"
            if [ "$n" -gt 100 ]; then echo "| … | | $((n-100)) more in the HTML report | |" >> "$md"; fi
            echo "</details>" >> "$md"
            rows="$RUNNER_TEMP/rows.html"; : > "$rows"
            while IFS="$tab" read -r lvl tool rid where uri msg help; do
              fixraw="$help"; link=""
              case "$uri" in
                http://*|https://*) link=" <a href=\"$uri\">docs ↗</a>" ;;
                "") : ;;
                *) if [ -z "$fixraw" ]; then fixraw="$uri"; fi ;;
              esac
              em=$(printf '%s' "$msg" | htmlesc); eh=$(printf '%s' "$fixraw" | htmlesc); ew=$(printf '%s' "$where" | htmlesc)
              printf '<tr><td class="%s">%s</td><td>%s<br><code>%s</code></td><td><code>%s</code></td><td>%s</td><td>%s%s</td></tr>\n' "$lvl" "$lvl" "$tool" "$rid" "$ew" "$em" "$eh" "$link"
            done < "$ordered" >> "$rows"
            {
              echo '<!doctype html><meta charset="utf-8"><title>'"$PREFIX"' security report</title>'
              echo '<style>body{font:14px system-ui,sans-serif;margin:2rem;color:#1a1a2e}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:.5rem .6rem;text-align:left;vertical-align:top}th{background:#f3f3f7}code{background:#f3f3f7;padding:.1em .3em;border-radius:3px}.error{color:#b3261e;font-weight:700}.warning{color:#8a5a00;font-weight:700}.note,.info{color:#555}a{color:#6034c2}</style>'
              echo "<h1>$PREFIX security report</h1><p>$n finding(s) · run <a href=\"$run_url\">$GITHUB_RUN_ID</a></p>"
              echo '<table><tr><th>Severity</th><th>Tool / Rule</th><th>Location</th><th>Issue</th><th>How to fix</th></tr>'
              cat "$rows"
              echo '</table>'
            } > "$report/$PREFIX-security-report.html"
          else
            { echo; echo "_No scanner findings._"; } >> "$md"
          fi
          {
            echo
            echo "SonarQube: every report above is bundled, ready for import, in the **$PREFIX.sonar-reports** artifact."
            echo
            echo "_Machine reports (SARIF/JSON) are in the run's artifacts; full logs in the [workflow run]($run_url)._"
          } >> "$md"
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more checks failed; see the summary table"
            exit 1
          fi
      # Post the same summary as a single sticky PR comment (created once, updated on
      # every later run), the way a human skims a review. Best-effort: it needs the
      # caller to grant `pull-requests: write`; without it the step warns and the
      # gate is unaffected. Runs on always() so a failure report is posted too.
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PREFIX: ${{ inputs.artifact-prefix }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          body="$RUNNER_TEMP/summary.md"
          [ -f "$body" ] || { echo "no summary to post"; exit 0; }
          marker="<!-- security-summary:$PREFIX -->"
          # --slurp so the filter runs once over all pages (a per-page --jq would
          # emit one id plus a null per empty page). Match only this workflow's own
          # bot comment, never a human quoting a past summary.
          id=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments" \
                 --jq "[.[][] | select(.user.login==\"github-actions[bot]\" and (.body | contains(\"$marker\")))] | .[0].id // empty" 2>/dev/null || true)
          if [ -n "${id:-}" ] && [ "$id" != "null" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$body" >/dev/null \
              && echo "updated the existing $PREFIX summary comment ($id)" \
              || echo "::warning::could not update the PR summary comment — grant 'pull-requests: write' in the caller"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$body" >/dev/null \
              && echo "posted the $PREFIX summary comment" \
              || echo "::warning::could not post the PR summary comment — grant 'pull-requests: write' in the caller"
          fi
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}.security-report
          path: ${{ runner.temp }}/report/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Sonar-ready reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}.sonar-reports
          path: ${{ runner.temp }}/sonar-reports/
          if-no-files-found: ignore
          retention-days: 30
