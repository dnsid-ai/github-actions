# GENERATED from security/src/iac.yml by scripts/build.py. Do not edit here:
# edit security/src/ and run `python3 scripts/build.py`.
# Infrastructure as code: Terraform, Kubernetes manifests and shell scripts,
# plus the shared secret, Trivy, Semgrep and workflow scans. Built for Terraform
# repos and for GitOps / Kustomize repos.
#
#   jobs:
#     iac:
#       uses: <org>/github-actions/.github/workflows/security-iac.yml@<sha> # v1
#       permissions: { contents: read, security-events: write, actions: read }
#       with:
#         manifests-command: kustomize build apps/prod
#
# Mark "<caller job> / Summary" as the required check. See README.md.
name: IaC

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project directory, relative to the repository root.
        type: string
        default: "."
      runs-on:
        description: Runner label. Must be Linux x64 (tools are downloaded as linux-amd64 binaries).
        type: string
        default: ubuntu-24.04
      enforce-security:
        description: >-
          When false (the default), security findings are reported but do not fail the
          build. Land warn-only, triage the baseline, then flip to true. Lint, tests and
          tool errors always fail regardless.
        type: boolean
        default: false
      upload-sarif:
        description: Upload SARIF results to GitHub code scanning (private repos need Advanced Security).
        type: boolean
        default: true
      semgrep:
        description: Run Semgrep. Custom rules in <working-directory>/.semgrep/ are picked up automatically.
        type: boolean
        default: true
      gitleaks:
        description: Run gitleaks over the full commit history.
        type: boolean
        default: true
      trivy:
        description: Run trivy fs (dependency vulnerabilities, IaC and Dockerfile misconfiguration, secrets).
        type: boolean
        default: true
      trivy-severity:
        description: Comma-separated Trivy severities to report.
        type: string
        default: HIGH,CRITICAL
      workflow-audit:
        description: Run zizmor over the repo's GitHub Actions workflows.
        type: boolean
        default: true
      artifact-prefix:
        description: Prefix for artifact names. Set it when one run calls this workflow more than once.
        type: string
        default: iac
      tflint:
        description: Run tflint over every Terraform directory.
        type: boolean
        default: true
      tflint-config:
        description: tflint config, relative to working-directory. It is passed as an absolute path, because --recursive otherwise looks for a config in each directory and silently runs without your plugins.
        type: string
        default: .tflint.hcl
      manifests-command:
        description: Command that prints rendered Kubernetes manifests to stdout (e.g. "kustomize build apps/prod"). Runs in working-directory.
        type: string
        default: ""
      manifests-path:
        description: Directory or file of plain Kubernetes manifests, used when manifests-command is empty.
        type: string
        default: ""
      kube-linter-config:
        description: kube-linter config, relative to working-directory. Used when present.
        type: string
        default: .kube-linter.yaml
      conftest-policy:
        description: Directory of OPA/Rego policies for conftest, relative to working-directory. Skipped when absent. Policy tests (*_test.rego) always block.
        type: string
        default: policy
      shellcheck:
        description: Run shellcheck over tracked *.sh and *.bash files.
        type: boolean
        default: true
      shellcheck-severity:
        description: Lowest shellcheck severity to report (error, warning, info, style). "info" includes SC2086, unquoted expansions.
        type: string
        default: info
      semgrep-rules:
        description: Space-separated Semgrep registry rulesets.
        type: string
        default: p/terraform p/kubernetes p/dockerfile p/secrets

permissions: {}

jobs:
  terraform:
    name: Terraform lint (tflint)
    if: inputs.tflint
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
      security-events: write # upload SARIF to code scanning
      actions: read # code scanning reads run metadata on private repos
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tflint 0.64.0, pinned by SHA-256 (verified against the release's published
      # checksums when it ships one). Bump VERSION and SHA256 together.
      - name: Install tflint
        env:
          VERSION: "0.64.0"
          SHA256: "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537"
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          pkg="$RUNNER_TEMP/tflint.download"
          curl -fsSL --retry 3 -o "$pkg" "https://github.com/terraform-linters/tflint/releases/download/v${VERSION}/tflint_linux_amd64.zip"
          echo "${SHA256}  $pkg" | sha256sum -c -
          unzip -o -q "$pkg" tflint -d "$bin"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Lint
        id: scan
        env:
          WD: ${{ inputs.working-directory }}
          CONFIG: ${{ inputs.tflint-config }}
          # Read-only: avoids the API rate limit when tflint downloads rule plugins.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/reports"; mkdir -p "$out"
          cd "$WD"
          sarif="$out/tflint.sarif"
          {
            echo "sarif=$sarif"
            echo "tool=tflint"
            echo "base=$WD"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$(git ls-files '*.tf' | head -n 1)" ]; then
            echo "No Terraform files; nothing to lint."
            jq -n '{version: "2.1.0", runs: [{tool: {driver: {name: "tflint"}}, results: []}]}' > "$sarif"
            exit 0
          fi
          args=(--recursive)
          if [ -f "$CONFIG" ]; then
            args+=(--config "$PWD/$CONFIG")
            tflint --init --config "$PWD/$CONFIG"
          fi
          # Record which rulesets actually loaded: a linter with no plugins is green over nothing.
          {
            echo "### tflint plugins"
            echo '```'
            tflint --version ${CONFIG:+--config "$PWD/$CONFIG"} 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tflint "${args[@]}" --format sarif --force > "$sarif"
      # Turns the scan step's SARIF into: a findings count (read by the summary job),
      # a table in the job summary, and, when enforce-security is on, a failing exit.
      # The scan step must have id "scan" and set outputs `sarif`, `tool` and,
      # optionally, `levels` (space-separated SARIF levels to count; empty = all) and
      # `base` (the directory the tool's paths are relative to; they are rewritten to
      # be repo-root-relative so code scanning can place them).
      - name: Report findings
        if: always() && steps.scan.outcome == 'success'
        env:
          ENFORCE: ${{ inputs.enforce-security }}
          SARIF: ${{ steps.scan.outputs.sarif }}
          TOOL: ${{ steps.scan.outputs.tool }}
          LEVELS: ${{ steps.scan.outputs.levels }}
          BASE: ${{ steps.scan.outputs.base }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ]; then
            jq --arg base "${BASE%/}" '
              del(.runs[]?.originalUriBaseIds)
              | (.runs[]?.results[]?.locations[]?.physicalLocation.artifactLocation) |=
                  (del(.uriBaseId) | .uri |= (if $base == "." or test("^(/|[a-z]+:)") then . else $base + "/" + . end))' \
              "$SARIF" > "$SARIF.rebased"
            mv "$SARIF.rebased" "$SARIF"
          fi
          # shellcheck disable=SC2016 # $levels is a jq variable, not a shell one
          filter='[.runs[]?.results[]? | select(($levels == "") or ((.level // "warning") as $l | $levels | split(" ") | index($l)))]'
          count=$(jq --arg levels "$LEVELS" "$filter | length" "$SARIF")
          echo "$count" > "$(dirname "$SARIF")/findings.txt"
          {
            echo "### $TOOL: $count finding(s)${LEVELS:+ (levels: $LEVELS)}"
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Level | Rule | Location |"
              echo "|---|---|---|"
              jq -r --arg levels "$LEVELS" "$filter"'[] | [(.level // "warning"), (.ruleId // "-"),
                  ((.locations[0].physicalLocation.artifactLocation.uri // "-") + ":" + ((.locations[0].physicalLocation.region.startLine // "") | tostring))]
                | map(tostring | gsub("\\|"; "\\|")) | "| \(.[0]) | `\(.[1])` | `\(.[2])` |"' "$SARIF" | head -n 100
              if [ "$count" -gt 100 ]; then echo "| | $((count - 100)) more in the reports artifact | |"; fi
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            if [ "$ENFORCE" = true ]; then
              echo "::error::$TOOL reported $count finding(s)"
              exit 1
            fi
            echo "::warning::$TOOL reported $count finding(s). Warn-only: set enforce-security: true to block merges."
          fi
      # Private repositories need GitHub Advanced Security to accept SARIF, and a repo
      # with CodeQL "default setup" switched on rejects advanced-setup CodeQL results.
      # Neither should fail the build: the same SARIF is always in the reports artifact.
      - name: Upload SARIF to code scanning
        id: upload-sarif
        if: always() && inputs.upload-sarif && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: ${{ inputs.artifact-prefix }}/${{ github.job }}
      - name: Note a failed SARIF upload
        if: always() && steps.upload-sarif.outcome == 'failure'
        run: |
          echo "::warning::SARIF upload to code scanning failed (no Advanced Security, CodeQL default setup enabled, or missing security-events: write). Results are still in the reports artifact."
          echo "> SARIF upload to code scanning failed; results are in the reports artifact only." >> "$GITHUB_STEP_SUMMARY"
      # Reports are staged under a directory named for the job, so every artifact
      # unpacks to <job>/... . Downloaders then use merge-multiple and get the same
      # layout whether one artifact matches or many; without merging, a single match
      # is unpacked flat and the job name is lost.
      - name: Stage reports
        if: always()
        env:
          JOB: ${{ github.job }}
        run: |
          if [ -d "$RUNNER_TEMP/reports" ]; then
            mkdir -p "$RUNNER_TEMP/upload/$JOB"
            cp -R "$RUNNER_TEMP/reports/." "$RUNNER_TEMP/upload/$JOB/"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}.reports.${{ github.job }}
          path: ${{ runner.temp }}/upload/
          if-no-files-found: ignore
          retention-days: 30

  kubernetes:
    name: Kubernetes posture and policy (kube-linter, conftest)
    if: inputs.manifests-command != '' || inputs.manifests-path != ''
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
      security-events: write # upload SARIF to code scanning
      actions: read # code scanning reads run metadata on private repos
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # kube-linter 0.8.3, pinned by SHA-256 (verified against the release's published
      # checksums when it ships one). Bump VERSION and SHA256 together.
      - name: Install kube-linter
        env:
          VERSION: "0.8.3"
          SHA256: "1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df"
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          pkg="$RUNNER_TEMP/kube-linter.download"
          curl -fsSL --retry 3 -o "$pkg" "https://github.com/stackrox/kube-linter/releases/download/v${VERSION}/kube-linter-linux.tar.gz"
          echo "${SHA256}  $pkg" | sha256sum -c -
          tar -xzf "$pkg" -C "$bin" kube-linter
          echo "$bin" >> "$GITHUB_PATH"
      # conftest 0.70.1, pinned by SHA-256 (verified against the release's published
      # checksums when it ships one). Bump VERSION and SHA256 together.
      - name: Install conftest
        env:
          VERSION: "0.70.1"
          SHA256: "613d124b8f6c1f3cee890491f7ab19114cca5a2102ca47cb2e6c35b4c23f9c8a"
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          pkg="$RUNNER_TEMP/conftest.download"
          curl -fsSL --retry 3 -o "$pkg" "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz"
          echo "${SHA256}  $pkg" | sha256sum -c -
          tar -xzf "$pkg" -C "$bin" conftest
          echo "$bin" >> "$GITHUB_PATH"
      - name: Lint and test manifests
        id: scan
        env:
          WD: ${{ inputs.working-directory }}
          RENDER: ${{ inputs.manifests-command }}
          MANIFESTS: ${{ inputs.manifests-path }}
          KL_CONFIG: ${{ inputs.kube-linter-config }}
          POLICY: ${{ inputs.conftest-policy }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/reports"; mkdir -p "$out" "$RUNNER_TEMP/k8s"
          cd "$WD"
          if [ -n "$RENDER" ]; then
            target="$RUNNER_TEMP/k8s/rendered.yaml"
            bash -euo pipefail -c "$RENDER" > "$target"
          else
            target="$MANIFESTS"
          fi
          kl=(lint --format sarif)
          if [ -f "$KL_CONFIG" ]; then kl+=(--config "$KL_CONFIG"); fi
          # Exit 1 means "findings"; a missing or invalid SARIF means the tool failed.
          kube-linter "${kl[@]}" "$target" > "$RUNNER_TEMP/k8s/kube-linter.sarif" || true
          jq -e '.runs' "$RUNNER_TEMP/k8s/kube-linter.sarif" > /dev/null
          sarifs=("$RUNNER_TEMP/k8s/kube-linter.sarif")
          if [ -d "$POLICY" ]; then
            # Policy unit tests always block: a broken policy passes everything.
            if [ -n "$(find "$POLICY" -name '*_test.rego' -print -quit)" ]; then
              conftest verify --policy "$POLICY"
            fi
            conftest test --policy "$POLICY" --all-namespaces --no-fail --output sarif "$target" > "$RUNNER_TEMP/k8s/conftest.sarif"
            sarifs+=("$RUNNER_TEMP/k8s/conftest.sarif")
          fi
          jq -s '{version: "2.1.0", "$schema": "https://json.schemastore.org/sarif-2.1.0.json", runs: [.[].runs[]]}' \
            "${sarifs[@]}" > "$out/kubernetes.sarif"
          {
            echo "sarif=$out/kubernetes.sarif"
            echo "tool=kube-linter + conftest"
            echo "base=$WD"
          } >> "$GITHUB_OUTPUT"
      # Turns the scan step's SARIF into: a findings count (read by the summary job),
      # a table in the job summary, and, when enforce-security is on, a failing exit.
      # The scan step must have id "scan" and set outputs `sarif`, `tool` and,
      # optionally, `levels` (space-separated SARIF levels to count; empty = all) and
      # `base` (the directory the tool's paths are relative to; they are rewritten to
      # be repo-root-relative so code scanning can place them).
      - name: Report findings
        if: always() && steps.scan.outcome == 'success'
        env:
          ENFORCE: ${{ inputs.enforce-security }}
          SARIF: ${{ steps.scan.outputs.sarif }}
          TOOL: ${{ steps.scan.outputs.tool }}
          LEVELS: ${{ steps.scan.outputs.levels }}
          BASE: ${{ steps.scan.outputs.base }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ]; then
