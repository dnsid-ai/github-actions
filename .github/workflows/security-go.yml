name: Go

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project directory, relative to the repository root.
        type: string
        default: "."
      runs-on:
        description: Runner label. Must be Linux x64 (tools are downloaded as linux-amd64 binaries).
        type: string
        default: ubuntu-24.04
      enforce-security:
        description: >-
          When false (the default), security findings are reported but do not fail the
          build. Land warn-only, triage the baseline, then flip to true. Lint, tests and
          tool errors always fail regardless.
        type: boolean
        default: false
      upload-sarif:
        description: Upload SARIF results to GitHub code scanning (private repos need Advanced Security).
        type: boolean
        default: true
      semgrep:
        description: Run Semgrep. Custom rules in <working-directory>/.semgrep/ are picked up automatically.
        type: boolean
        default: true
      gitleaks:
        description: Run gitleaks over the full commit history.
        type: boolean
        default: true
      trivy:
        description: Run trivy fs (dependency vulnerabilities, IaC and Dockerfile misconfiguration, secrets).
        type: boolean
        default: true
      trivy-severity:
        description: Comma-separated Trivy severities to report.
        type: string
        default: HIGH,CRITICAL
      workflow-audit:
        description: Run zizmor over the repo's GitHub Actions workflows.
        type: boolean
        default: true
      codeql:
        description: Run CodeQL. Turn off if the repo uses CodeQL "default setup" instead.
        type: boolean
        default: true
      codeql-queries:
        description: CodeQL query suite (security-extended or security-and-quality).
        type: string
        default: security-extended
      dependency-review:
        description: On pull requests, flag newly added vulnerable dependencies.
        type: boolean
        default: true
      dependency-review-severity:
        description: Lowest severity that dependency review reports (low, moderate, high, critical).
        type: string
        default: high
      sbom:
        description: Generate an SPDX SBOM of the project (uploaded in the reports artifact).
        type: boolean
        default: false
      sonar-host-url:
        description: SonarQube server URL. Empty skips the Sonar job; reports are still published as an artifact.
        type: string
        default: ""
      sonar-args:
        description: Extra sonar-scanner arguments, e.g. "-Dsonar.projectKey=my-service".
        type: string
        default: ""
      artifact-prefix:
        description: Prefix for artifact names. Set it when one run calls this workflow more than once.
        type: string
        default: go
      go-version-file:
        description: File to read the Go version from, relative to working-directory.
        type: string
        default: go.mod
      go-modules:
        description: Space-separated module directories, relative to working-directory (e.g. ". key/aws").
        type: string
        default: "."
      go-drop-local-replaces:
        description: >-
          Drop replace directives that point at local directories (e.g. a
          `=> ../sdk` sibling checkout used for development) and build against the
          required versions instead. CI has no sibling checkouts.
        type: boolean
        default: false
      go-private:
        description: GOPRIVATE pattern for private modules (e.g. "github.com/your-org/*"). Needs the GO_PRIVATE_TOKEN secret.
        type: string
        default: ""
      golangci-lint-version:
        description: golangci-lint version. The repo's .golangci.yml is used when present.
        type: string
        default: v2.13.2
      govulncheck-version:
        description: golang.org/x/vuln version for govulncheck.
        type: string
        default: v1.8.0
      gosec-version:
        description: securego/gosec version for the gosec SAST job.
        type: string
        default: v2.29.0
      test-flags:
        description: Flags for go test.
