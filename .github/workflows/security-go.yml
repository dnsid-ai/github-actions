  secrets:
    name: Secrets (gitleaks)
    if: inputs.gitleaks
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      security-events: write # upload SARIF to code scanning
      actions: read # code scanning reads run metadata on private repos
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # gitleaks 8.30.1, pinned by SHA-256 (verified against the release's published
      # checksums when it ships one). Bump VERSION and SHA256 together.
      - name: Install gitleaks
        env:
          VERSION: "8.30.1"
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          pkg="$RUNNER_TEMP/gitleaks.download"
          curl -fsSL --retry 3 -o "$pkg" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $pkg" | sha256sum -c -
          tar -xzf "$pkg" -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"
