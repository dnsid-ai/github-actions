        required: false

permissions: {}

jobs:
  lint:
    name: Lint (gofmt, go vet, golangci-lint)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory }}/${{ inputs.go-version-file }}
          cache: false
      - name: Configure private modules
        if: inputs.go-private != ''
        env:
          PATTERN: ${{ inputs.go-private }}
          TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::go-private is set but the GO_PRIVATE_TOKEN secret was not passed"
            exit 1
          fi
          echo "GOPRIVATE=$PATTERN" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Drop local replace directives
        if: inputs.go-drop-local-replaces
        env:
          WD: ${{ inputs.working-directory }}
          MODULES: ${{ inputs.go-modules }}
        run: |
          set -euo pipefail
          cd "$WD"
          for mod in $MODULES; do
            (
              cd "$mod"
              for old in $(go mod edit -json | jq -r '.Replace[]? | select(.New.Path | test("^(\\.{1,2}/|/)")) | .Old.Path + (if .Old.Version then "@" + .Old.Version else "" end)'); do
                echo "::notice::$mod: dropping local replace for $old; building against the version go.mod requires"
                go mod edit -dropreplace="$old"
              done
            )
          done
          # go.sum has no entries for a module that was replaced by a local directory, so
          # let the go command add them. Each is verified against the checksum database.
          echo "GOFLAGS=-mod=mod" >> "$GITHUB_ENV"
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}
          install-only: true
      - name: Lint
        env:
          WD: ${{ inputs.working-directory }}
          MODULES: ${{ inputs.go-modules }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/reports"; mkdir -p "$out"
          status=0
          cd "$WD"
          for mod in $MODULES; do
            name=$(printf '%s' "$mod" | tr -c 'A-Za-z0-9' '_')
            echo "::group::$mod"
            unformatted=$(cd "$mod" && gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "::error::gofmt: these files in $mod need formatting:"
              echo "$unformatted"
              status=1
            fi
            (cd "$mod" && go vet ./...) || status=1
            (cd "$mod" && golangci-lint run --output.text.path=stdout \
              --output.checkstyle.path="$out/golangci-$name.xml" ./...) || status=1
            echo "::endgroup::"
          done
          exit "$status"
      # Reports are staged under a directory named for the job, so every artifact
      # unpacks to <job>/... . Downloaders then use merge-multiple and get the same
      # layout whether one artifact matches or many; without merging, a single match
      # is unpacked flat and the job name is lost.
      - name: Stage reports
        if: always()
        env:
          JOB: ${{ github.job }}
        run: |
          if [ -d "$RUNNER_TEMP/reports" ]; then
            mkdir -p "$RUNNER_TEMP/upload/$JOB"
            cp -R "$RUNNER_TEMP/reports/." "$RUNNER_TEMP/upload/$JOB/"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}.reports.${{ github.job }}
          path: ${{ runner.temp }}/upload/
          if-no-files-found: ignore
          retention-days: 30

  test:
    name: Test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read # check out the code
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
