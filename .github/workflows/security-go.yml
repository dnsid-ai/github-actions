                go mod edit -dropreplace="$old"
              done
            )
          done
          # go.sum has no entries for a module that was replaced by a local directory, so
          # let the go command add them. Each is verified against the checksum database.
          echo "GOFLAGS=-mod=mod" >> "$GITHUB_ENV"
      - name: Scan
        id: scan
        env:
          WD: ${{ inputs.working-directory }}
          MODULES: ${{ inputs.go-modules }}
          VERSION: ${{ inputs.govulncheck-version }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/reports"; mkdir -p "$out" "$RUNNER_TEMP/govulncheck"
          # Fetched through the Go module proxy and verified against the checksum database.
          # GOTOOLCHAIN=auto: recent govulncheck releases need a newer Go to build than the
          # module under test may pin; Go fetches that toolchain (checksum-verified) for the
          # install only. The analysis still runs with the module's own Go.
          GOTOOLCHAIN=auto GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/vuln/cmd/govulncheck@$VERSION"
          cd "$WD"
          for mod in $MODULES; do
            name=$(printf '%s' "$mod" | tr -c 'A-Za-z0-9' '_')
            # SARIF mode exits 0 when it finds vulnerabilities and non-zero only on errors.
            (cd "$mod" && "$RUNNER_TEMP/bin/govulncheck" -format sarif ./...) > "$RUNNER_TEMP/govulncheck/$name.sarif"
          done
          # One run per upload: code scanning rejects several runs of one tool in a file.
          jq -s 'reduce .[] as $d (null;
                   if . == null then $d
                   else .runs[0].results += ($d.runs[0].results // [])
                      | .runs[0].tool.driver.rules = ((.runs[0].tool.driver.rules // []) + ($d.runs[0].tool.driver.rules // []) | unique_by(.id))
                   end)' "$RUNNER_TEMP"/govulncheck/*.sarif > "$out/govulncheck.sarif"
          # levels=error: count only calls into vulnerable functions. "warning" and
          # "note" mean the vulnerable package or module is present but not reached.
          {
            echo "sarif=$out/govulncheck.sarif"
            echo "tool=govulncheck"
            echo "levels=error"
          } >> "$GITHUB_OUTPUT"
      # Turns the scan step's SARIF into: a findings count (read by the summary job),
      # a table in the job summary, and, when enforce-security is on, a failing exit.
      # The scan step must have id "scan" and set outputs `sarif`, `tool` and,
      # optionally, `levels` (space-separated SARIF levels to count; empty = all) and
      # `base` (the directory the tool's paths are relative to; they are rewritten to
      # be repo-root-relative so code scanning can place them).
      - name: Report findings
        if: always() && steps.scan.outcome == 'success'
        env:
          ENFORCE: ${{ inputs.enforce-security }}
          SARIF: ${{ steps.scan.outputs.sarif }}
          TOOL: ${{ steps.scan.outputs.tool }}
          LEVELS: ${{ steps.scan.outputs.levels }}
          BASE: ${{ steps.scan.outputs.base }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ]; then
            jq --arg base "${BASE%/}" '
              del(.runs[]?.originalUriBaseIds)
              | (.runs[]?.results[]?.locations[]?.physicalLocation.artifactLocation) |=
                  (del(.uriBaseId) | .uri |= (if $base == "." or test("^(/|[a-z]+:)") then . else $base + "/" + . end))' \
              "$SARIF" > "$SARIF.rebased"
            mv "$SARIF.rebased" "$SARIF"
          fi
          # shellcheck disable=SC2016 # $levels is a jq variable, not a shell one
          filter='[.runs[]?.results[]? | select(($levels == "") or ((.level // "warning") as $l | $levels | split(" ") | index($l)))]'
          count=$(jq --arg levels "$LEVELS" "$filter | length" "$SARIF")
          echo "$count" > "$(dirname "$SARIF")/findings.txt"
          {
            echo "### $TOOL: $count finding(s)${LEVELS:+ (levels: $LEVELS)}"
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Level | Rule | Location |"
              echo "|---|---|---|"
              jq -r --arg levels "$LEVELS" "$filter"'[] | [(.level // "warning"), (.ruleId // "-"),
                  ((.locations[0].physicalLocation.artifactLocation.uri // "-") + ":" + ((.locations[0].physicalLocation.region.startLine // "") | tostring))]
                | map(tostring | gsub("\\|"; "\\|")) | "| \(.[0]) | `\(.[1])` | `\(.[2])` |"' "$SARIF" | head -n 100
              if [ "$count" -gt 100 ]; then echo "| | $((count - 100)) more in the reports artifact | |"; fi
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            if [ "$ENFORCE" = true ]; then
              echo "::error::$TOOL reported $count finding(s)"
              exit 1
            fi
            echo "::warning::$TOOL reported $count finding(s). Warn-only: set enforce-security: true to block merges."
          fi
      # Private repositories need GitHub Advanced Security to accept SARIF, and a repo
      # with CodeQL "default setup" switched on rejects advanced-setup CodeQL results.
      # Neither should fail the build: the same SARIF is always in the reports artifact.
      - name: Upload SARIF to code scanning
        id: upload-sarif
        if: always() && inputs.upload-sarif && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: ${{ inputs.artifact-prefix }}/${{ github.job }}
      - name: Note a failed SARIF upload
        if: always() && steps.upload-sarif.outcome == 'failure'
        run: |
          echo "::warning::SARIF upload to code scanning failed (no Advanced Security, CodeQL default setup enabled, or missing security-events: write). Results are still in the reports artifact."
          echo "> SARIF upload to code scanning failed; results are in the reports artifact only." >> "$GITHUB_STEP_SUMMARY"
      # Reports are staged under a directory named for the job, so every artifact
      # unpacks to <job>/... . Downloaders then use merge-multiple and get the same
      # layout whether one artifact matches or many; without merging, a single match
      # is unpacked flat and the job name is lost.
