      - name: Drop local replace directives
        if: inputs.go-drop-local-replaces
        env:
          WD: ${{ inputs.working-directory }}
          MODULES: ${{ inputs.go-modules }}
        run: |
          set -euo pipefail
          cd "$WD"
          for mod in $MODULES; do
            (
              cd "$mod"
              for old in $(go mod edit -json | jq -r '.Replace[]? | select(.New.Path | test("^(\\.{1,2}/|/)")) | .Old.Path + (if .Old.Version then "@" + .Old.Version else "" end)'); do
                echo "::notice::$mod: dropping local replace for $old; building against the version go.mod requires"
                go mod edit -dropreplace="$old"
              done
            )
          done
          # go.sum has no entries for a module that was replaced by a local directory, so
          # let the go command add them. Each is verified against the checksum database.
          echo "GOFLAGS=-mod=mod" >> "$GITHUB_ENV"
      - name: go test
        env:
          WD: ${{ inputs.working-directory }}
          MODULES: ${{ inputs.go-modules }}
          FLAGS: ${{ inputs.test-flags }}
          PACKAGES: ${{ inputs.test-packages }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/reports"; mkdir -p "$out"
          cd "$WD"
          echo "### Go test" >> "$GITHUB_STEP_SUMMARY"
          # GitHub starts `run:` steps with `bash -e`, and `set -uo pipefail`
          # does not clear that inherited `-e`. Turn it off explicitly here, so
          # a failing `go test` pipeline does not abort the step before its
          # output is captured and summarised (setup above stays fatal). The
          # real test exit is tracked in rc and returned at the end, so the
          # gate still fails on a genuine test failure — only reporting is
          # made non-fatal.
          set +e
          rc=0
          for mod in $MODULES; do
            name=$(printf '%s' "$mod" | tr -c 'A-Za-z0-9' '_')
            log="$out/test-$name.log"
            # shellcheck disable=SC2086 # FLAGS and PACKAGES are word lists
            (cd "$mod" && go test $FLAGS -covermode=atomic -coverprofile="$out/coverage-$name.out" $PACKAGES) 2>&1 | tee "$log"
            mrc=${PIPESTATUS[0]}
            if [ "$mrc" -eq 0 ]; then
              total=$(cd "$mod" && go tool cover -func="$out/coverage-$name.out" 2>/dev/null | awk '/^total:/ {print $NF}')
              echo "- \`$mod\`: pass · coverage ${total:-n/a}" >> "$GITHUB_STEP_SUMMARY"
            else
              rc=1
              {
                echo "- \`$mod\`: **FAIL**"
                echo ""
                echo '```'
                # The failing test names and the assertion/panic lines — the
                # "what went wrong" that was previously only in the raw log.
                grep -E '^[[:space:]]*(--- FAIL:|=== (FAIL|NAME)|[[:alnum:]_./-]+\.go:[0-9]+:|panic:|goroutine )|^FAIL([[:space:]]|$)' "$log" | head -60
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY" || true
            fi
          done
          exit "$rc"
      # Reports are staged under a directory named for the job, so every artifact
      # unpacks to <job>/... . Downloaders then use merge-multiple and get the same
      # layout whether one artifact matches or many; without merging, a single match
      # is unpacked flat and the job name is lost.
      - name: Stage reports
        if: always()
        env:
          JOB: ${{ github.job }}
        run: |
          if [ -d "$RUNNER_TEMP/reports" ]; then
            mkdir -p "$RUNNER_TEMP/upload/$JOB"
            cp -R "$RUNNER_TEMP/reports/." "$RUNNER_TEMP/upload/$JOB/"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}.reports.${{ github.job }}
          path: ${{ runner.temp }}/upload/
          if-no-files-found: ignore
          retention-days: 30

  deps:
    name: Dependency vulnerabilities (govulncheck)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
      security-events: write # upload SARIF to code scanning
      actions: read # code scanning reads run metadata on private repos
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
