      # checksums when it ships one). Bump VERSION and SHA256 together.
      - name: Install trivy
        env:
          VERSION: "0.74.0"
          SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
