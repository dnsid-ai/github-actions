# GENERATED from security/src/python.yml by scripts/build.py. Do not edit here:
# edit security/src/ and run `python3 scripts/build.py`.
# Python: lint, test, and security scanning in one reusable workflow.
#
#   jobs:
#     python:
#       uses: <org>/github-actions/.github/workflows/security-python.yml@<sha> # v1
#       permissions: { contents: read, security-events: write, actions: read }
#
# Mark "<caller job> / Summary" as the required check. See README.md.
name: Python

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project directory, relative to the repository root.
        type: string
        default: "."
      runs-on:
        description: Runner label. Must be Linux x64 (tools are downloaded as linux-amd64 binaries).
        type: string
        default: ubuntu-24.04
      enforce-security:
        description: >-
          When false (the default), security findings are reported but do not fail the
          build. Land warn-only, triage the baseline, then flip to true. Lint, tests and
          tool errors always fail regardless.
        type: boolean
        default: false
      upload-sarif:
        description: Upload SARIF results to GitHub code scanning (private repos need Advanced Security).
        type: boolean
        default: true
      semgrep:
        description: Run Semgrep. Custom rules in <working-directory>/.semgrep/ are picked up automatically.
        type: boolean
        default: true
      gitleaks:
        description: Run gitleaks over the full commit history.
        type: boolean
        default: true
      trivy:
        description: Run trivy fs (dependency vulnerabilities, IaC and Dockerfile misconfiguration, secrets).
        type: boolean
        default: true
      trivy-severity:
        description: Comma-separated Trivy severities to report.
        type: string
        default: HIGH,CRITICAL
      workflow-audit:
        description: Run zizmor over the repo's GitHub Actions workflows.
        type: boolean
        default: true
      codeql:
        description: Run CodeQL. Turn off if the repo uses CodeQL "default setup" instead.
        type: boolean
        default: true
      codeql-queries:
        description: CodeQL query suite (security-extended or security-and-quality).
        type: string
        default: security-extended
      dependency-review:
        description: On pull requests, flag newly added vulnerable dependencies.
        type: boolean
        default: true
      dependency-review-severity:
        description: Lowest severity that dependency review reports (low, moderate, high, critical).
        type: string
        default: high
      sbom:
        description: Generate an SPDX SBOM of the project (uploaded in the reports artifact).
        type: boolean
        default: false
      sonar-host-url:
        description: SonarQube server URL. Empty skips the Sonar job; reports are still published as an artifact.
        type: string
        default: ""
      sonar-args:
        description: Extra sonar-scanner arguments, e.g. "-Dsonar.projectKey=my-service".
        type: string
        default: ""
      artifact-prefix:
        description: Prefix for artifact names. Set it when one run calls this workflow more than once.
        type: string
        default: python
      python-version:
        description: Python version for setup-python.
        type: string
        default: "3.12"
      uv-version:
        description: uv version, used when the project has a uv.lock.
        type: string
        default: 0.12.18
      install-command:
        description: >-
          Override the install step. Must leave the project installed in
          <working-directory>/.venv. Default: `uv sync --locked` with a uv.lock,
          otherwise `pip install -e ".[dev]"`.
        type: string
        default: ""
      ruff-version:
        description: ruff version, used only when the project does not install ruff itself.
        type: string
        default: 0.16.9
      format-check:
        description: Fail when `ruff format --check` finds unformatted files.
        type: boolean
        default: true
      mypy-target:
        description: Package or path to type-check with mypy (mypy must be a dev dependency). Empty skips mypy.
        type: string
        default: ""
      pytest-args:
        description: Arguments for pytest (run under coverage).
        type: string
        default: ""
      pip-audit-version:
        description: pip-audit version.
        type: string
        default: 2.10.1
      semgrep-rules:
        description: Space-separated Semgrep registry rulesets.
        type: string
        default: p/python p/secrets
    secrets:
      SONAR_TOKEN:
        required: false

permissions: {}

jobs:
  lint:
    name: Lint (ruff, mypy) and security lint (ruff S)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
      security-events: write # upload SARIF to code scanning
      actions: read # code scanning reads run metadata on private repos
    env:
      TOOLS: ruff==${{ inputs.ruff-version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the project into <working-directory>/.venv and puts it on PATH.
      # With a uv.lock this is `uv sync --locked`: CI gets exactly the locked versions
      # and fails if the lock is stale. Without one it falls back to pip, which
      # resolves fresh every run, and says so.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Set up uv
        if: hashFiles(format('{0}/uv.lock', inputs.working-directory)) != ''
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: false
      - name: Install project
        id: env
        env:
          WD: ${{ inputs.working-directory }}
          INSTALL: ${{ inputs.install-command }}
        run: |
          set -euo pipefail
          cd "$WD"
          if [ -n "$INSTALL" ]; then
            mode=custom
            bash -euo pipefail -c "$INSTALL"
          elif [ -f uv.lock ]; then
            mode=uv
            uv sync --locked --all-extras --all-groups
          else
            mode=pip
            echo "::warning::No uv.lock in $WD: dependencies are resolved fresh on every run, so CI is not reproducible."
            python -m venv .venv
            .venv/bin/python -m pip install --quiet --disable-pip-version-check --upgrade pip
            if [ -f pyproject.toml ] || [ -f setup.py ]; then
              .venv/bin/python -m pip install --quiet -e ".[dev]"
            fi
            if [ -f requirements.txt ]; then .venv/bin/python -m pip install --quiet -r requirements.txt; fi
            if [ -f requirements-dev.txt ]; then .venv/bin/python -m pip install --quiet -r requirements-dev.txt; fi
          fi
          if [ ! -x .venv/bin/python ]; then
            echo "::error::install-command must create $WD/.venv"
            exit 1
          fi
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Install tool into the project environment
        # $TOOLS (set by the job) are CLIs the job needs inside the project venv,
        # skipped when the project already provides them.
        if: env.TOOLS != ''
        env:
          WD: ${{ inputs.working-directory }}
          MODE: ${{ steps.env.outputs.mode }}
        run: |
          set -euo pipefail
          cd "$WD"
          missing=()
          for spec in $TOOLS; do
            exe=${spec%%[=<>]*}
            if [ ! -x ".venv/bin/$exe" ]; then missing+=("$spec"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then exit 0; fi
          echo "Installing ${missing[*]} (not provided by the project)"
          if [ "$MODE" = uv ]; then
            uv pip install --quiet "${missing[@]}"
          else
            .venv/bin/python -m pip install --quiet --disable-pip-version-check "${missing[@]}"
          fi
      - name: Lint
        env:
          WD: ${{ inputs.working-directory }}
          FORMAT_CHECK: ${{ inputs.format-check }}
          MYPY_TARGET: ${{ inputs.mypy-target }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/reports"; mkdir -p "$out"
          cd "$WD"
          status=0
          ruff check --output-format=github . || status=1
          # Same findings as JSON for SonarQube.
          ruff check --output-format=json --exit-zero . > "$out/ruff.json"
          if [ "$FORMAT_CHECK" = true ]; then ruff format --check . || status=1; fi
          if [ -n "$MYPY_TARGET" ]; then
            # shellcheck disable=SC2086 # MYPY_TARGET may list several paths
            mypy $MYPY_TARGET || status=1
          fi
          exit "$status"
      # The flake8-bandit rules (ruff "S"), whatever the project's own ruff
      # config selects. Reported like every other security scanner.
      - name: Security lint
        id: scan
        if: always()
        env:
          WD: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/reports"; mkdir -p "$out"
          (cd "$WD" && ruff check --select S --output-format=sarif --exit-zero .) > "$out/ruff-security.sarif"
          {
            echo "sarif=$out/ruff-security.sarif"
            echo "tool=ruff (S: bandit rules)"
          } >> "$GITHUB_OUTPUT"
      # Turns the scan step's SARIF into: a findings count (read by the summary job),
      # a table in the job summary, and, when enforce-security is on, a failing exit.
      # The scan step must have id "scan" and set outputs `sarif`, `tool` and,
      # optionally, `levels` (space-separated SARIF levels to count; empty = all) and
      # `base` (the directory the tool's paths are relative to; they are rewritten to
      # be repo-root-relative so code scanning can place them).
      - name: Report findings
        if: always() && steps.scan.outcome == 'success'
        env:
          ENFORCE: ${{ inputs.enforce-security }}
          SARIF: ${{ steps.scan.outputs.sarif }}
          TOOL: ${{ steps.scan.outputs.tool }}
          LEVELS: ${{ steps.scan.outputs.levels }}
          BASE: ${{ steps.scan.outputs.base }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ]; then
            jq --arg base "${BASE%/}" '
              del(.runs[]?.originalUriBaseIds)
              | (.runs[]?.results[]?.locations[]?.physicalLocation.artifactLocation) |=
                  (del(.uriBaseId) | .uri |= (if $base == "." or test("^(/|[a-z]+:)") then . else $base + "/" + . end))' \
              "$SARIF" > "$SARIF.rebased"
            mv "$SARIF.rebased" "$SARIF"
          fi
          # shellcheck disable=SC2016 # $levels is a jq variable, not a shell one
          filter='[.runs[]?.results[]? | select(($levels == "") or ((.level // "warning") as $l | $levels | split(" ") | index($l)))]'
          count=$(jq --arg levels "$LEVELS" "$filter | length" "$SARIF")
          echo "$count" > "$(dirname "$SARIF")/findings.txt"
          {
            echo "### $TOOL: $count finding(s)${LEVELS:+ (levels: $LEVELS)}"
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Level | Rule | Location |"
              echo "|---|---|---|"
              jq -r --arg levels "$LEVELS" "$filter"'[] | [(.level // "warning"), (.ruleId // "-"),
                  ((.locations[0].physicalLocation.artifactLocation.uri // "-") + ":" + ((.locations[0].physicalLocation.region.startLine // "") | tostring))]
                | map(tostring | gsub("\\|"; "\\|")) | "| \(.[0]) | `\(.[1])` | `\(.[2])` |"' "$SARIF" | head -n 100
              if [ "$count" -gt 100 ]; then echo "| | $((count - 100)) more in the reports artifact | |"; fi
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            if [ "$ENFORCE" = true ]; then
              echo "::error::$TOOL reported $count finding(s)"
              exit 1
            fi
            echo "::warning::$TOOL reported $count finding(s). Warn-only: set enforce-security: true to block merges."
          fi
      # Private repositories need GitHub Advanced Security to accept SARIF, and a repo
      # with CodeQL "default setup" switched on rejects advanced-setup CodeQL results.
      # Neither should fail the build: the same SARIF is always in the reports artifact.
      - name: Upload SARIF to code scanning
        id: upload-sarif
        if: always() && inputs.upload-sarif && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: ${{ inputs.artifact-prefix }}/${{ github.job }}
      - name: Note a failed SARIF upload
        if: always() && steps.upload-sarif.outcome == 'failure'
        run: |
          echo "::warning::SARIF upload to code scanning failed (no Advanced Security, CodeQL default setup enabled, or missing security-events: write). Results are still in the reports artifact."
          echo "> SARIF upload to code scanning failed; results are in the reports artifact only." >> "$GITHUB_STEP_SUMMARY"
      # Reports are staged under a directory named for the job, so every artifact
      # unpacks to <job>/... . Downloaders then use merge-multiple and get the same
      # layout whether one artifact matches or many; without merging, a single match
      # is unpacked flat and the job name is lost.
      - name: Stage reports
        if: always()
        env:
          JOB: ${{ github.job }}
        run: |
          if [ -d "$RUNNER_TEMP/reports" ]; then
            mkdir -p "$RUNNER_TEMP/upload/$JOB"
            cp -R "$RUNNER_TEMP/reports/." "$RUNNER_TEMP/upload/$JOB/"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}.reports.${{ github.job }}
          path: ${{ runner.temp }}/upload/
          if-no-files-found: ignore
          retention-days: 30

  test:
    name: Test (pytest)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read # check out the code
    env:
      TOOLS: coverage==7.16.2 pytest
    steps:
