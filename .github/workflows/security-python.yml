  # Runs only once a SonarQube server exists (sonar-host-url set). Until then the
  # summary job publishes the same reports as the <prefix>.sonar-reports artifact.
  sonar:
    name: SonarQube
    if: always() && inputs.sonar-host-url != ''
    needs: [lint, test, deps, semgrep, secrets, trivy, workflow-audit]
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-prefix }}.reports.*
          path: ${{ runner.temp }}/all
          merge-multiple: true
      - name: Map reports to Sonar properties
        id: props
        run: |
          set -euo pipefail
          all="$RUNNER_TEMP/all"; mkdir -p "$all"
          list() { find "$all" -type f -name "$1" | sort | paste -sd, -; }
          args=()
          add() { if [ -n "$2" ]; then args+=("-D$1=$2"); fi; }
          add sonar.sarifReportPaths "$(list '*.sarif')"
          add sonar.go.coverage.reportPaths "$(list 'coverage-*.out')"
          add sonar.go.golangci-lint.reportPaths "$(list 'golangci-*.xml')"
          add sonar.python.coverage.reportPaths "$(list 'coverage.xml')"
          add sonar.python.ruff.reportPaths "$(list 'ruff.json')"
          add sonar.javascript.lcov.reportPaths "$(list 'lcov.info')"
          add sonar.eslint.reportPaths "$(list 'eslint.json')"
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: ${{ steps.props.outputs.args }} ${{ inputs.sonar-args }}

  summary:
    name: Summary
    if: always()
    needs: [lint, test, deps, codeql, semgrep, secrets, trivy, workflow-audit, dependency-review, sbom, sonar]
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
      pull-requests: write # post the sticky PR comment; capped by the caller's grant, so a caller that omits it just gets a 403-warn, not a failure
    env:
      REQUIRED_REPORTS: lint deps codeql semgrep secrets trivy workflow-audit
    steps:
      # The one check a caller needs to mark as required. It fails when any job
      # failed, and when a scanner job "succeeded" without writing a report: that
      # would be a gate that is green over nothing. The job needs `env.REQUIRED_REPORTS`,
      # the space-separated ids of jobs that must leave a report whenever they run.
      - name: Download reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-prefix }}.reports.*
          path: ${{ runner.temp }}/all
          merge-multiple: true # each artifact holds <job>/..., see upload-reports.yml
      - name: Summarize
        env:
          NEEDS: ${{ toJSON(needs) }}
          PREFIX: ${{ inputs.artifact-prefix }}
          ENFORCE: ${{ inputs.enforce-security }}
        run: |
          set -euo pipefail
          all="$RUNNER_TEMP/all"; mkdir -p "$all"
          sonar="$RUNNER_TEMP/sonar-reports"; mkdir -p "$sonar"
          # Build the report once into a file, then publish it to both the run's
          # job summary and (in the "Comment on the PR" step) a sticky PR comment.
          md="$RUNNER_TEMP/summary.md"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fail=0
          {
            echo "<!-- security-summary:$PREFIX -->"
            echo "## $PREFIX: summary"
            echo
            if [ "$ENFORCE" = true ]; then
              echo "Security findings **block** this check (enforce-security: true)."
            else
              echo "Security findings are **warn-only** (enforce-security: false). Lint, test and tool failures still block."
            fi
            echo
            echo "| Job | Result | Findings | Report files |"
            echo "|---|---|---|---|"
          } > "$md"
          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            dir="$all/$job"
            files="-"; findings="-"
            if [ -d "$dir" ] && [ -n "$(find "$dir" -type f -print -quit)" ]; then
              files=$(find "$dir" -type f ! -name findings.txt -printf '%f\n' | sort | paste -sd' ' -)
              if [ -f "$dir/findings.txt" ]; then findings=$(cat "$dir/findings.txt"); fi
              # Flatten into one Sonar-ready bundle, prefixed by job so names can't collide.
              find "$dir" -type f ! -name findings.txt -exec sh -c 'cp "$1" "$2/$3-$(basename "$1")"' _ {} "$sonar" "$job" \;
            elif [ "$result" = success ] && [[ " $REQUIRED_REPORTS " == *" $job "* ]]; then
              result="success, but NO REPORT: did the scanner run?"
              fail=1
            fi
            case "$result" in failure|cancelled) fail=1 ;; esac
            echo "| $job | $result | $findings | $files |" >> "$md"
          done
          {
            echo
            if [ "$fail" -ne 0 ]; then echo "**Result: failed** — see the failing job(s) above."; else echo "**Result: passed.**"; fi
          } >> "$md"
          # Human-readable findings, rendered from the collected SARIF: a how-to-fix
          # table in the comment and job summary, and a self-contained HTML report
          # uploaded as an artifact. The remediation text and docs links come from
          # each tool's own rule metadata (help / helpUri).
          report="$RUNNER_TEMP/report"; mkdir -p "$report"
          tsv="$RUNNER_TEMP/findings.tsv"; : > "$tsv"
          # shellcheck disable=SC2016 # $run/$rules/$r are jq variables, not shell
          jqprog='
            .runs[]? as $run
            | ($run.tool.driver.name // "tool") as $tool
            | ($run.tool.driver.rules // []) as $rules
            | $run.results[]? | . as $r
            | ($r.ruleId // $r.rule.id // "") as $rid
            | (if ($r.ruleIndex // -1) >= 0 then ($rules[$r.ruleIndex] // {}) else ((first($rules[]? | select(.id==$rid))) // {}) end) as $rule
            | ($r.level // $rule.defaultConfiguration.level // "warning") as $lvl
            | ($r.locations[0].physicalLocation // {}) as $loc
            | (($loc.artifactLocation.uri // "") + (if $loc.region.startLine then ":"+($loc.region.startLine|tostring) else "" end)) as $where
            | ($rule.helpUri // "") as $uri
            | (($r.message.text // "") | gsub("[\t\n]";" ")) as $msg
            | (($rule.help.text // $rule.fullDescription.text // $rule.shortDescription.text // "") | gsub("[\t\n]";" ")) as $help
            | [$lvl,$tool,$rid,$where,$uri,$msg,$help] | @tsv'
          while IFS= read -r sf; do jq -r "$jqprog" "$sf" 2>/dev/null >> "$tsv" || true; done < <(find "$all" -name '*.sarif' 2>/dev/null)
          n=$(wc -l < "$tsv" | tr -d ' '); n=${n:-0}
          ordered="$RUNNER_TEMP/findings.ordered"
          { grep -P '^error\t' "$tsv" || true; grep -P '^warning\t' "$tsv" || true; grep -Pv '^(error|warning)\t' "$tsv" || true; } > "$ordered"
          htmlesc() { sed -e 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }
          tab=$(printf '\t')
          if [ "$n" -gt 0 ]; then
            {
              echo
              echo "Full HTML report with remediation: the **$PREFIX.security-report** artifact on [this run]($run_url)."
              echo
              echo "<details><summary><b>Findings ($n)</b> — where and how to fix</summary>"
              echo
              echo "| Sev | Location | Issue | How to fix |"
              echo "|---|---|---|---|"
            } >> "$md"
            head -100 "$ordered" | while IFS="$tab" read -r lvl tool rid where uri msg help; do
              fix="$help"; if [ -n "$uri" ]; then fix="$help [docs]($uri)"; fi
              # shellcheck disable=SC2016 # the backticks are literal markdown, not a command substitution
              printf '| %s | `%s` | %s <sub>%s/%s</sub> | %s |\n' "$lvl" "$where" "$msg" "$tool" "$rid" "$fix"
            done >> "$md"
            if [ "$n" -gt 100 ]; then echo "| … | | $((n-100)) more in the HTML report | |" >> "$md"; fi
            echo "</details>" >> "$md"
            rows="$RUNNER_TEMP/rows.html"; : > "$rows"
            while IFS="$tab" read -r lvl tool rid where uri msg help; do
              em=$(printf '%s' "$msg" | htmlesc); eh=$(printf '%s' "$help" | htmlesc); ew=$(printf '%s' "$where" | htmlesc)
              link=""; if [ -n "$uri" ]; then link=" <a href=\"$uri\">docs ↗</a>"; fi
              printf '<tr><td class="%s">%s</td><td>%s<br><code>%s</code></td><td><code>%s</code></td><td>%s</td><td>%s%s</td></tr>\n' "$lvl" "$lvl" "$tool" "$rid" "$ew" "$em" "$eh" "$link"
            done < "$ordered" >> "$rows"
            {
              echo '<!doctype html><meta charset="utf-8"><title>'"$PREFIX"' security report</title>'
              echo '<style>body{font:14px system-ui,sans-serif;margin:2rem;color:#1a1a2e}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:.5rem .6rem;text-align:left;vertical-align:top}th{background:#f3f3f7}code{background:#f3f3f7;padding:.1em .3em;border-radius:3px}.error{color:#b3261e;font-weight:700}.warning{color:#8a5a00;font-weight:700}.note,.info{color:#555}a{color:#6034c2}</style>'
              echo "<h1>$PREFIX security report</h1><p>$n finding(s) · run <a href=\"$run_url\">$GITHUB_RUN_ID</a></p>"
              echo '<table><tr><th>Severity</th><th>Tool / Rule</th><th>Location</th><th>Issue</th><th>How to fix</th></tr>'
              cat "$rows"
              echo '</table>'
            } > "$report/$PREFIX-security-report.html"
          else
            { echo; echo "_No scanner findings._"; } >> "$md"
          fi
          {
            echo
            echo "SonarQube: every report above is bundled, ready for import, in the **$PREFIX.sonar-reports** artifact."
            echo
            echo "_Machine reports (SARIF/JSON) are in the run's artifacts; full logs in the [workflow run]($run_url)._"
          } >> "$md"
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more checks failed; see the summary table"
            exit 1
          fi
      # Post the same summary as a single sticky PR comment (created once, updated on
      # every later run), the way a human skims a review. Best-effort: it needs the
      # caller to grant `pull-requests: write`; without it the step warns and the
      # gate is unaffected. Runs on always() so a failure report is posted too.
      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PREFIX: ${{ inputs.artifact-prefix }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          body="$RUNNER_TEMP/summary.md"
          [ -f "$body" ] || { echo "no summary to post"; exit 0; }
          marker="<!-- security-summary:$PREFIX -->"
          # --slurp so the filter runs once over all pages (a per-page --jq would
          # emit one id plus a null per empty page). Match only this workflow's own
          # bot comment, never a human quoting a past summary.
          id=$(gh api --paginate --slurp "repos/$REPO/issues/$PR/comments" \
                 --jq "[.[][] | select(.user.login==\"github-actions[bot]\" and (.body | contains(\"$marker\")))] | .[0].id // empty" 2>/dev/null || true)
          if [ -n "${id:-}" ] && [ "$id" != "null" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$body" >/dev/null \
              && echo "updated the existing $PREFIX summary comment ($id)" \
              || echo "::warning::could not update the PR summary comment — grant 'pull-requests: write' in the caller"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$body" >/dev/null \
              && echo "posted the $PREFIX summary comment" \
              || echo "::warning::could not post the PR summary comment — grant 'pull-requests: write' in the caller"
          fi
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}.security-report
          path: ${{ runner.temp }}/report/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Sonar-ready reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}.sonar-reports
          path: ${{ runner.temp }}/sonar-reports/
          if-no-files-found: ignore
          retention-days: 30
